name: Deploy project page

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - '.nojekyll'
      - 'site/**'
      - 'demo/**'
      - 'imgs/**'
      - 'Hierarchical_LTL.pdf'
      - 'scripts/package_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Package website assets
        run: python3 scripts/package_site.py _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
